name: Integration tests

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_OBSERVER_URL: https://test-observer-api.canonical.com

jobs:
  resolve-snap-info:
    name: Resolve snap version and revision
    runs-on: ubuntu-latest
    # Only run if the release workflow completed successfully
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.snap-info.outputs.version }}
      revision: ${{ steps.snap-info.outputs.revision }}
    steps:
      - name: Query latest/edge version and revision
        id: snap-info
        run: |
          # Query once (not once per field) and retry, since the store can
          # transiently return no latest/edge line.
          for attempt in {1..5}; do
            edge_line=$(snap info intel-npu-driver | grep latest/edge || true)
            [ -n "$edge_line" ] && break
            echo "snap info returned no latest/edge line (attempt $attempt), retrying..."
            sleep 60
          done
          revision=$(echo "$edge_line" | cut -d "(" -f2 | cut -d ")" -f1)
          version=$(echo "$edge_line" | awk '{print $2}')
          if [ -z "$revision" ] || [ -z "$version" ]; then
            echo "::error::Failed to parse revision/version from snap info latest/edge line: '$edge_line'"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  testflinger-validation:
    name: Testflinger Validation
    needs: resolve-snap-info
    runs-on: ubuntu-latest
    # Only run if the release workflow completed successfully
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        # Generations to validate; each is resolved to a queue/image via the
        # most recent successful lab-history entry (see .github/lab-history,
        # populated by test-lab-reserve-device.yaml).
        gen: ["MTL", "LNL", "ARL"]
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # A public repo cannot call a private repo's reusable workflow, so check the
      # actions out with the PE bot PAT and invoke them by local path instead.
      - name: Check out partner-eng-gh-actions
        uses: actions/checkout@v7
        with:
          repository: canonical/partner-eng-gh-actions
          ref: lab/various-improvements
          token: ${{ secrets.PE_BOT_PAT }}
          path: .github/actions/partner-eng-gh-actions

      - name: Resolve device from lab history
        id: device
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/device-from-repo-history
        with:
          history_path: ${{ github.workspace }}/.github/lab-history
          cpu_codename: ${{ matrix.gen }}
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}

      - name: Fail if no recorded device matched
        if: ${{ steps.device.outputs.matched != 'true' }}
        run: |
          echo "::error::No successful lab-history entry found for generation ${{ matrix.gen }}"
          exit 1

      - name: Build job file from template with oem_autoinstall provisioning
        run: |
          sed -e "s|REPLACE_QUEUE|${{ steps.device.outputs.queue }}|" \
          -e "s|REPLACE_IMAGE_URL|$(jq -r '.image' <<< '${{ steps.device.outputs.details }}')|" \
          ${GITHUB_WORKSPACE}/.github/testflinger/job-def.yaml > \
          ${GITHUB_WORKSPACE}/job.yaml
      - name: Submit testflinger job
        id: submit
        continue-on-error: true
        uses: canonical/testflinger/.github/actions/submit@submit/v1.5.1
        with:
          poll: true
          job-path: ${{ github.workspace }}/job.yaml
          client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}

      # submit.outcome is a single pass/fail for the whole job (provision + test
      # phases combined), so it can't be used as a provisioning signal on its own
      # -- a real test failure (this workflow's whole purpose) would otherwise
      # also get wrongly recorded as a provisioning failure. Check the provision
      # phase's own result directly instead.
      - name: Check provisioning status
        id: provision-status
        if: always()
        env:
          TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
        run: |
          job_id="${{ steps.submit.outputs.id }}"
          status=""
          if [ -n "$job_id" ]; then
            status="$(testflinger results "$job_id" 2>/dev/null | jq -r '.provision_status // empty')"
          fi
          if [ "$status" = "0" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$status" ]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          else
            # provision_status wasn't populated; we can't tell whether that's
            # because provisioning itself failed or only the test phase did, so
            # report unknown rather than guessing.
            echo "provisioned=unknown" >> "$GITHUB_OUTPUT"
          fi

      # Record the outcome so a failed provisioning attempt isn't re-picked by
      # device-from-repo-history on a re-run (its own PR merges independently).
      - name: Record device history
        if: always()
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/update-history
        with:
          device: ${{ steps.device.outputs.device }}
          queue: ${{ steps.device.outputs.queue }}
          device_context: ${{ steps.device.outputs.details }}
          job_path: ${{ github.workspace }}/job.yaml
          outcome: skipped
          provision_outcome: ${{ steps.provision-status.outputs.provisioned == 'true' && 'passed' || steps.provision-status.outputs.provisioned == 'false' && 'failed' || 'unknown' }}
          job_id: ${{ steps.submit.outputs.id }}

      - name: Download checkbox artifacts
        id: artifacts
        env:
          TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
        run: |
          # Download the job artifacts with retry logic
          for attempt in {1..10}; do
            echo "Attempt $attempt: Downloading artifacts..."
            if testflinger artifacts ${{ steps.submit.outputs.id }}; then
              echo "Successfully downloaded artifacts"
              break
            else
              if [ $attempt -eq 10 ]; then
                echo "Failed to download artifacts after 10 attempts"
                exit 1
              fi
              echo "Failed to download artifacts, retrying in 60 seconds..."
              sleep 60
            fi
          done
          tar -xzf artifacts.tgz

          # Check if any .tar.xz files exist
          if ! ls artifacts/*.tar.xz 1> /dev/null 2>&1; then
            echo "Error: No .tar.xz files found in artifacts/"
            ls -la artifacts/
            exit 1
          fi

          # Extract submission.json from each tarball.
          #
          # This is necessary because the test plan is run twice:
          # - Once on the original OEM image
          # - Once after upgrading all apt packages and rebooting
          #
          # The test observer uploader action cannot account for multiple
          # submissions in a single run, so we need to extract them here and
          # upload them separately.
          #
          queue="${{ steps.device.outputs.queue }}"
          mkdir -p "extracted-artifacts/$queue"
          i=0
          for file in artifacts/*.tar.xz; do
            if [ -f "$file" ]; then
              echo "Extracting submission.json from: $file"
              run_dir="extracted-artifacts/$queue/run-$i"
              mkdir -p "$run_dir"

              # Extract only submission.json
              tar -xJf "$file" submission.json -O > "$run_dir/submission.json"
              chmod 644 "$run_dir/submission.json"
              if [ ! -s "$run_dir/submission.json" ]; then
                echo "Error: $run_dir/submission.json is empty or missing after extraction"
                ls -la "$run_dir"
                exit 1
              fi

              # Build environment key, for example: env0=MTL-24.04.3-6.17-generic
              kernel_ver=$(jq -r '[.system_information | .. | objects | to_entries[] | select(.key | endswith("#Kernel")) | .value] | first' "$run_dir/submission.json")
              os_ver=$(jq -r '[.system_information | .. | objects | to_entries[] | select(.key | endswith("#Distro")) | .value] | first | match("Ubuntu ([0-9.]+)") | .captures[0].string' "$run_dir/submission.json")
              echo "env$i=${{ matrix.gen }}-${os_ver}-${kernel_ver}" >> $GITHUB_OUTPUT

              # Save tarball path to output
              echo "tarball$i=$file" >> $GITHUB_OUTPUT

              i=$((i + 1))
            fi
          done
      - name: Upload checkbox artifacts
        uses: actions/upload-artifact@v7
        with:
          name: checkbox-results-${{ steps.device.outputs.queue }}
          path: extracted-artifacts/
      - name: Get numeric job ID
        id: job-id
        run: |
          jobs=$(gh api /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs)
          # Matrix jobs include the matrix value in their name, e.g. "Testflinger Validation (MTL)"
          job_id=$(echo "$jobs" | jq -r '.jobs[] | select(.name | contains("${{ matrix.gen }}")) | .id')
          echo "id=$job_id" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate TO start-payload
        env:
          SNAP_VERSION: ${{ needs.resolve-snap-info.outputs.version }}
          SNAP_REVISION: ${{ needs.resolve-snap-info.outputs.revision }}
        run: |
          test_plan=$(grep "^unit = " ${GITHUB_WORKSPACE}/.github/testflinger/checkbox-launcher | cut -d '=' -f2 | xargs)
          cat <<EOF > start-payload-0.json
          {
            "name": "intel-npu-driver",
            "version": "${SNAP_VERSION}",
            "arch": "amd64",
            "test_plan": "${test_plan}",
            "environment": "${{ steps.artifacts.outputs.env0 }}",
            "initial_status": "IN_PROGRESS",
            "needs_assignment": false,
            "family": "snap",
            "revision": "${SNAP_REVISION}",
            "track": "latest",
            "store": "ubuntu",
            "branch": "",
            "execution_stage": "edge"
          }
          EOF
          jq '.environment = "${{ steps.artifacts.outputs.env1 }}"' start-payload-0.json > start-payload-1.json
      - name: Upload first test results to test observer
        if: steps.artifacts.outputs.tarball0 != ''
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/test-observer-uploader
        with:
          results_type: checkbox
          owner: kobuk
          start_test_api_payload: start-payload-0.json
          ci_link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.job-id.outputs.id }}#pre-upgrade
          results: ${{ steps.artifacts.outputs.tarball0 }}
          test_observer_url: ${{ env.TEST_OBSERVER_URL }}
          api_key: ${{ secrets.TEST_OBSERVER_API_KEY_PRODUCTION }}
      - name: Upload second test results to test observer
        if: steps.artifacts.outputs.tarball1 != ''
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/test-observer-uploader
        with:
          results_type: checkbox
          owner: kobuk
          start_test_api_payload: start-payload-1.json
          ci_link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.job-id.outputs.id }}#post-upgrade
          results: ${{ steps.artifacts.outputs.tarball1 }}
          test_observer_url: ${{ env.TEST_OBSERVER_URL }}
          api_key: ${{ secrets.TEST_OBSERVER_API_KEY_PRODUCTION }}
  tag:
    name: Push tag for revision
    needs: [resolve-snap-info, testflinger-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the source
        uses: actions/checkout@v7
      - name: Create and push tag for revision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_VERSION: ${{ needs.resolve-snap-info.outputs.version }}
          SNAP_REVISION: ${{ needs.resolve-snap-info.outputs.revision }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          tag_name="${SNAP_VERSION}-rev${SNAP_REVISION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${tag_name}"; then
            echo "Tag ${tag_name} already exists in remote repo. Doing nothing."
          else
            git tag -a "${tag_name}" -m "Revision ${SNAP_REVISION}"
            git push origin "${tag_name}"
          fi
