name: Test lab-reserve-device-by-prompt

# Test harness for the lab-reserve-device tooling in partner-eng-gh-actions.
# partner-eng-gh-actions is private and this repo is public, so we cannot call
# its reusable workflow directly (the default token can't check out the private
# actions). Instead we check the actions out with the PE bot PAT and invoke them
# by local path, mirroring integration-tests.yaml. Triggers on pushes to the
# testing branch.
on:
  push:
    branches:
      - feature/vibe-coder
  workflow_dispatch:
    inputs:
      prefer_new:
        description: 'Prefer devices not yet provisioned successfully (spread coverage)'
        type: boolean
        default: false

# Avoid overlapping runs holding lab hardware.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reserve:
    name: Reserve lab device
    runs-on: ubuntu-latest
    steps:
      # Security: the lab agents run `copilot --allow-all-tools` with lab
      # credentials in env while ingesting untrusted content, so a prompt-injection
      # payload could try to exfiltrate secrets. harden-runner monitors egress; run
      # in `audit` to capture the endpoint set, then switch egress-policy to `block`.
      # allowed-endpoints below is reconciled from a real audit run. NOTE: the snap
      # content CDN POPs (canonical-*.cdn.snapcraftcontent.com) are geo-routed and can
      # rotate between runs; in `block` mode a run that hits a different POP will fail
      # the snap install, so re-audit and add POPs as needed before relying on block.
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
          disable-sudo: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            api.githubcopilot.com:443
            api.business.githubcopilot.com:443
            telemetry.business.githubcopilot.com:443
            registry.npmjs.org:443
            pypi.org:443
            api.snapcraft.io:443
            canonical-bos01.cdn.snapcraftcontent.com:443
            canonical-lgw01.cdn.snapcraftcontent.com:443
            testflinger.canonical.com:443
            certification.canonical.com:443

      - name: Check out repository under test
        uses: actions/checkout@v7

      # partner-eng-gh-actions is private; check it out with the PE bot PAT and
      # reference the lab-* actions by local path (same pattern as
      # integration-tests.yaml).
      - name: Check out partner-eng-gh-actions
        uses: actions/checkout@v7
        with:
          repository: canonical/partner-eng-gh-actions
          ref: feature/vibe-tester
          token: ${{ secrets.PE_BOT_PAT }}
          path: .github/actions/partner-eng-gh-actions

      - name: Find lab device
        id: find-device
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/find-device
        with:
          device_prompt: 'A device with an ARM CPU running Ubuntu 26.04'
          c3_client_id: ${{ secrets.C3_CLIENT_ID }}
          c3_client_secret: ${{ secrets.C3_CLIENT_SECRET }}
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          hwcert_jobs_token: ${{ secrets.PE_BOT_PAT }}
          history_path: ${{ github.workspace }}/.github/lab-history
          prefer_new: ${{ inputs.prefer_new || false }}

      - name: Fail if no device matched
        if: ${{ steps.find-device.outputs.matched != 'true' }}
        run: |
          echo "::error::No lab device matched the description"
          exit 1

      - name: Reserve device
        id: reserve
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/reserve-device
        with:
          queue: ${{ steps.find-device.outputs.queue }}
          device_context: ${{ steps.find-device.outputs.details }}
          launchpad_user: wfrench
          reserve_minutes: 30
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Record device history
        if: ${{ always() && steps.find-device.outputs.matched == 'true' }}
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/update-history
        with:
          device: ${{ steps.find-device.outputs.device }}
          queue: ${{ steps.find-device.outputs.queue }}
          device_context: ${{ steps.find-device.outputs.details }}
          job_path: ${{ steps.reserve.outputs.job_path }}
          outcome: skipped
          provision_outcome: ${{ steps.reserve.outputs.provisioned == 'true' && 'passed' || steps.reserve.outputs.provisioned == 'false' && 'failed' || 'unknown' }}
          job_id: ${{ steps.reserve.outputs.job_id }}
