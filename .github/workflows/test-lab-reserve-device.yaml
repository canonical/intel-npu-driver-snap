name: Test lab-reserve-device-by-prompt

on:
  push:
    branches:
      - feature/vibe-coder
    # Only run when this harness (or the tooling it exercises) actually changes.
    paths:
      - .github/workflows/test-lab-reserve-device.yaml
  schedule:
    # Daily device reservation to build up cross-generation lab-history coverage;
    # schedule always runs against the default branch (main).
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      device_prompt:
        description: 'Free-form description of the lab device'
        type: string
        default: 'A device containing a Intel NPU running Ubuntu 24.04'
      record_history:
        description: 'Record the reservation outcome into .github/lab-history and open a rolling PR'
        type: boolean
        default: true
      prefer_new:
        description: 'Prefer devices not yet provisioned successfully (spread coverage)'
        type: boolean
        default: true
      reserve_minutes:
        description: 'Minutes to reserve the matched device for'
        type: string
        default: '1'

# Avoid overlapping runs holding lab hardware.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  reserve:
    name: Reserve lab device
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Fan out across generations in parallel on push only; schedule/workflow_dispatch
        # use their own single free-form prompt, so 'auto' just runs the job once.
        gen: ${{ github.event_name == 'push' && fromJSON('["MTL","LNL","ARL"]') || fromJSON('["auto"]') }}
      fail-fast: false
    # Backstop so a stuck agent can't hold the runner
    timeout-minutes: 190
    steps:
      # Egress control. Must be the first step so bullfrog can see all outbound
      # traffic; anything not on the allowlist is blocked. snap-CDN POPs may
      # rotate and need re-adding.
      - name: Control egress (bullfrog)
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            objects.githubusercontent.com
            api.githubcopilot.com
            api.business.githubcopilot.com
            telemetry.business.githubcopilot.com
            registry.npmjs.org
            pypi.org
            api.snapcraft.io
            canonical-bos01.cdn.snapcraftcontent.com
            canonical-lgw01.cdn.snapcraftcontent.com
            testflinger.canonical.com
            certification.canonical.com

      - name: Check out repository under test
        uses: actions/checkout@v7

      # update-history opens a rolling PR per run instead of committing straight to
      # main, so main's history can lag behind very recent (unmerged) reservations.
      # Build an overlay copy (never the checked-out .github/lab-history itself, so
      # update-history's commit can't pick up other PRs' files) with any still-open
      # lab-history PRs merged in, for find-device to consult.
      - name: Overlay pending lab-history PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          overlay_dir="${RUNNER_TEMP}/lab-history-overlay"
          rm -rf "${overlay_dir}"
          cp -r .github/lab-history "${overlay_dir}" 2>/dev/null || mkdir -p "${overlay_dir}/devices"
          devices_dir="${overlay_dir}/devices"
          for branch in $(gh pr list --label lab-history --state open --json headRefName --jq '.[].headRefName'); do
            git fetch --depth 1 origin "${branch}:refs/remotes/origin/${branch}" 2>/dev/null || continue
            for path in $(git ls-tree -r --name-only "origin/${branch}" -- .github/lab-history/devices 2>/dev/null); do
              candidate="$(git show "origin/${branch}:${path}")"
              dest="${overlay_dir}/${path#.github/lab-history/}"
              if [[ ! -f "${dest}" || "$(jq -r '.last_run.at' <<< "${candidate}")" > "$(jq -r '.last_run.at' "${dest}")" ]]; then
                mkdir -p "$(dirname "${dest}")"
                echo "${candidate}" > "${dest}"
              fi
            done
          done

      # A public repo cannot call a private repo's reusable workflow, so check the
      # actions out with the PE bot PAT and invoke them by local path instead.
      - name: Check out partner-eng-gh-actions
        uses: actions/checkout@v7
        with:
          repository: canonical/partner-eng-gh-actions
          ref: lab/various-improvements
          token: ${{ secrets.PE_BOT_PAT }}
          path: .github/actions/partner-eng-gh-actions

      - name: Find lab device
        id: find-device
        timeout-minutes: 20
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/find-device
        with:
          # push fans out one prompt per matrix.gen (parallel, harness self-test);
          # schedule (daily coverage-building run) falls back to one that spreads
          # hardware diversity itself.
          device_prompt: ${{ inputs.device_prompt || (github.event_name == 'push' && format('A device with an Intel {0} NPU running Ubuntu 24.04', matrix.gen)) || (github.event_name == 'schedule' && 'A device containing an Intel NPU running Ubuntu 26.04 or 24.04. Consult job history from .github/lab-history (on main branch only) and try to test different generations of NPU (e.g. MTL, LNL, ARL, PTL), vendors (e.g. Dell, Lenovo), and form factors (laptop, desktop) that are not yet well covered.') || 'A device with an Intel MTL NPU running Ubuntu 24.04' }}
          c3_client_id: ${{ secrets.C3_CLIENT_ID }}
          c3_client_secret: ${{ secrets.C3_CLIENT_SECRET }}
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          hwcert_jobs_token: ${{ secrets.PE_BOT_PAT }}
          history_path: ${{ runner.temp }}/lab-history-overlay
          # On push there are no inputs, so default prefer_new to true; a
          # workflow_dispatch run can still override it to false.
          prefer_new: ${{ github.event_name != 'workflow_dispatch' || inputs.prefer_new }}

      - name: Fail if no device matched
        if: ${{ steps.find-device.outputs.matched != 'true' }}
        run: |
          echo "::error::No lab device matched the description"
          exit 1

      - name: Reserve device
        id: reserve
        timeout-minutes: 150
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/reserve-device
        with:
          queue: ${{ steps.find-device.outputs.queue }}
          device_context: ${{ steps.find-device.outputs.details }}
          launchpad_user: wfrench
          reserve_minutes: ${{ inputs.reserve_minutes || 1 }}
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Record device history
        if: ${{ always() && steps.find-device.outputs.matched == 'true' && (github.event_name != 'workflow_dispatch' || inputs.record_history) }}
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab/update-history
        with:
          device: ${{ steps.find-device.outputs.device }}
          queue: ${{ steps.find-device.outputs.queue }}
          device_context: ${{ steps.find-device.outputs.details }}
          job_path: ${{ steps.reserve.outputs.job_path }}
          outcome: skipped
          provision_outcome: ${{ steps.reserve.outputs.provisioned == 'true' && 'passed' || steps.reserve.outputs.provisioned == 'false' && 'failed' || 'unknown' }}
          job_id: ${{ steps.reserve.outputs.job_id }}
