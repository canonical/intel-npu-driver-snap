name: Test lab-reserve-device-by-prompt

# Test harness for the lab-reserve-device tooling in partner-eng-gh-actions.
# partner-eng-gh-actions is private and this repo is public, so we cannot call
# its reusable workflow directly (the default token can't check out the private
# actions). Instead we check the actions out with the PE bot PAT and invoke them
# by local path, mirroring integration-tests.yaml. Triggers on pushes to the
# testing branch.
on:
  push:
    branches:
      - feature/vibe-coder
  workflow_dispatch:

# Avoid overlapping runs holding lab hardware.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reserve:
    name: Reserve lab device
    runs-on: self-hosted-linux-amd64-noble-private-endpoint-small
    steps:
      # partner-eng-gh-actions is private; check it out with the PE bot PAT and
      # reference the lab-* actions by local path (same pattern as
      # integration-tests.yaml).
      - name: Check out partner-eng-gh-actions
        uses: actions/checkout@v7
        with:
          repository: canonical/partner-eng-gh-actions
          ref: feature/vibe-tester
          token: ${{ secrets.PE_BOT_PAT }}
          path: .github/actions/partner-eng-gh-actions

      - name: Find lab device
        id: find-device
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab-find-device
        with:
          device_prompt: 'An Intel laptop with an NPU running Ubuntu 24.04'
          c3_client_id: ${{ secrets.C3_CLIENT_ID }}
          c3_client_secret: ${{ secrets.C3_CLIENT_SECRET }}
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          hwcert_jobs_token: ${{ secrets.PE_BOT_PAT }}

      - name: Fail if no device matched
        if: ${{ steps.find-device.outputs.matched != 'true' }}
        run: |
          echo "::error::No lab device matched the description"
          exit 1

      - name: Reserve device
        uses: ./.github/actions/partner-eng-gh-actions/.github/actions/lab-reserve-device
        with:
          queue: ${{ steps.find-device.outputs.queue }}
          device_context: ${{ steps.find-device.outputs.details }}
          launchpad_user: wfrench
          reserve_minutes: 30
          testflinger_client_id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger_secret_key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          copilot_github_token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
