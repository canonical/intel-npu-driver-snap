name: Test lab-vibe-test

# Test harness for the lab-vibe-test tooling in partner-eng-gh-actions.
# partner-eng-gh-actions is private, so we call its reusable workflow and pass
# PE_BOT_ORG_READ_ACCESS_PAT (mapped from PE_BOT_PAT) so the workflow can check
# out the private composite actions and hwcert job-data. Triggers on pushes to
# the testing branch.
on:
  push:
    branches:
      - feature/vibe-coder
    # Only run when this harness (or the tooling it exercises) actually changes.
    paths:
      - .github/workflows/test-lab-vibe-test.yaml
  workflow_dispatch:
    inputs:
      device_prompt:
        description: 'Free-form description of the lab device'
        type: string
        default: 'A device containing a Intel NPU running Ubuntu 24.04'
      record_history:
        description: 'Record the run outcome into .github/lab-history and open a rolling PR'
        type: boolean
        default: true
      prefer_new:
        description: 'Prefer devices not yet successfully run on (spread coverage)'
        type: boolean
        default: true

# Avoid overlapping runs holding lab hardware.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  vibe-test:
    name: Vibe test on lab device
    uses: canonical/partner-eng-gh-actions/.github/workflows/lab-vibe-test.yml@feature/vibe-tester
    with:
      device_prompt: ${{ inputs.device_prompt || 'A device with an Intel Panther Lake CPU running Ubuntu 24.04' }}
      # On push there are no inputs, so default record_history/prefer_new to true;
      # a workflow_dispatch run can still override either to false.
      prefer_new: ${{ github.event_name != 'workflow_dispatch' || inputs.prefer_new }}
      record_history: ${{ github.event_name != 'workflow_dispatch' || inputs.record_history }}
    secrets:
      C3_CLIENT_ID: ${{ secrets.C3_CLIENT_ID }}
      C3_CLIENT_SECRET: ${{ secrets.C3_CLIENT_SECRET }}
      TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
      TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      # Maps the intel repo's existing PE bot PAT to the reusable workflow's
      # org-read secret so it can check out the private actions + hwcert job-data.
      PE_BOT_ORG_READ_ACCESS_PAT: ${{ secrets.PE_BOT_PAT }}
